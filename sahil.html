<!DOCTYPE html>
<html lang="en">
<head>

      margin: 0;
      padding: 0;

    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #faf5f5;
      color: #2d3748;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #fed7d7;
      border-top-color: #9b2c2c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #9b2c2c;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      text-decoration: none;
      background-color: #9b2c2c;
      color: #ffffff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background-color: #7b1d1d;
    }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Invitation Planner</title>
  
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzKBwwd2iXxCsqJN8P_FZK0YvCzy6Y8aebCPuxJHS6YHU3MK8PGeU3l3Vbyt7FlBhqXVg/exec">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #fffaf0;
      color: #2d3748;
      text-align: center;
      padding: 1.25rem;
    }
    .card {
      background: #ffffff;
      padding: 2.25rem 1.75rem;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #fed7d7;
      border-top-color: #9b2c2c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #9b2c2c;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      background-color: #9b2c2c;
      color: #ffffff;
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(155, 44, 44, 0.25);
    }
  </style>

  <script>
    const TARGET_URL = "https://script.google.com/macros/s/AKfycbzKBwwd2iXxCsqJN8P_FZK0YvCzy6Y8aebCPuxJHS6YHU3MK8PGeU3l3Vbyt7FlBhqXVg/exec";

    function launch() {
      window.location.href = TARGET_URL;
    }

    launch();
    window.addEventListener("DOMContentLoaded", launch);
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Wedding Planner</h2>
    <p>Opening invitation tracker. If it doesn't open automatically, tap below:</p>
    <a id="actionBtn" class="btn" href="https://script.google.com/macros/s/AKfycbzKBwwd2iXxCsqJN8P_FZK0YvCzy6Y8aebCPuxJHS6YHU3MK8PGeU3l3Vbyt7FlBhqXVg/exec">Open Invitation Tracker</a>
  </div>
</body>
</html>

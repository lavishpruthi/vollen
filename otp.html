<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>OTP Service Dashboard</title>
<style>
  :root {
    --bg: #0a0e14;
    --bg-grid: #0d1219;
    --sidebar-bg: #0d131b;
    --card-bg: #12181f;
    --card-bg-raised: #161d26;
    --border: #232b36;
    --border-soft: #1a212b;
    --text: #c9d4e0;
    --text-dim: #6b7686;
    --text-bright: #eef2f7;
    --accent: #3fb1ff;
    --accent-dim: #1a4a6e;
    --ok: #35d488;
    --ok-dim: #12352a;
    --warn: #f0a83c;
    --warn-dim: #3a2c12;
    --danger: #ff5d6c;
    --danger-dim: #3a1620;
    --purple: #b48bff;
    --purple-dim: #2a1f47;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-w: 320px;
    --tap: 44px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--sans);
    background:
      radial-gradient(circle at 15% 0%, rgba(63,177,255,0.06), transparent 40%),
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 28px,
      var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- Layout shell ---------- */
  .shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.7rem;
    padding: 0.75rem clamp(0.9rem, 3vw, 1.6rem);
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,20,0.9);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }

  .hamburger {
    display: none;
    width: var(--tap); height: var(--tap);
    align-items: center; justify-content: center;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); flex: none; padding: 0;
  }
  .hamburger svg { width: 18px; height: 18px; stroke: var(--text-bright); }

  .mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #1a6fa8);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; font-size: 0.85rem; color: #041018;
    flex: none;
  }

  .topbar h1 { font-size: 1.02rem; margin: 0; color: var(--text-bright); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .sub { font-size: 0.7rem; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; }
  .topbar-titles { min-width: 0; }

  .balance-tag {
    background: var(--purple-dim);
    border: 1px solid rgba(180,139,255,0.3);
    padding: 6px 12px; border-radius: 20px;
    font-size: 0.78rem; font-family: var(--mono); color: var(--purple);
    display: flex; align-items: center; gap: 6px;
    flex: none;
  }
  .balance-tag .val { color: #d7c6ff; font-weight: 700; }

  /* ---------- Sidebar / Drawer ---------- */
  .drawer-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(4,6,10,0.6);
    z-index: 39;
  }
  .drawer-backdrop.show { display: block; }

  .sidebar {
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 1.1rem;
    display: flex; flex-direction: column; gap: 0.9rem;
  }

  .side-block {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
  }
  .side-block-title {
    font-size: 0.68rem; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.85rem;
    display: flex; justify-content: space-between; align-items: center;
  }

  label {
    display: block; font-size: 0.7rem; color: var(--text-dim);
    margin-bottom: 0.35rem; font-weight: 650; text-transform: uppercase;
  }
  .input-group { margin-bottom: 0.8rem; }
  .input-group:last-child { margin-bottom: 0; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  input[type="text"], input[type="password"] {
    width: 100%; padding: 11px; min-height: var(--tap);
    background: #0a0f16; border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text-bright);
    font-family: var(--mono); font-size: 0.9rem;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,177,255,0.15); }

  .key-field { position: relative; display: flex; align-items: center; }
  .key-field input { padding-right: 48px; }
  .toggle-visibility {
    position: absolute; right: 4px; background: none; border: none;
    color: var(--text-dim); font-size: 0.65rem; font-family: var(--mono);
    cursor: pointer; padding: 8px 10px; min-height: 36px;
  }

  button {
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-sm); font-weight: 650; cursor: pointer;
    font-family: var(--sans); transition: filter 0.15s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
  button:focus-visible, input:focus-visible, .icon-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #1c7fc4);
    color: #041018; width: 100%; padding: 12px; font-size: 0.9rem; min-height: var(--tap);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-secondary {
    background: #1b222b; color: var(--text); padding: 10px; font-size: 0.78rem; width: 100%;
    margin-top: 6px; min-height: 40px;
  }
  .btn-balance {
    background: var(--purple-dim); color: #d7c6ff; border-color: rgba(180,139,255,0.3);
    font-size: 0.78rem; padding: 10px; width: 100%; margin-top: 0.5rem; min-height: 40px;
  }
  .btn-cancel {
    background: var(--danger-dim); color: #ffb3ba; border-color: rgba(255,93,108,0.3);
    padding: 10px 14px; font-size: 0.78rem; font-family: var(--mono); min-height: var(--tap); flex: 1;
  }
  .btn-new-code {
    background: var(--warn-dim); color: #ffd28a; border-color: rgba(240,168,60,0.3);
    padding: 10px 14px; font-size: 0.78rem; min-height: var(--tap); flex: 1;
  }
  .icon-btn {
    background: var(--card-bg-raised); color: var(--text-dim); border: 1px solid var(--border);
    width: var(--tap); height: var(--tap); flex: none; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm);
  }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; }
  .icon-btn.copied { color: var(--ok); border-color: rgba(53,212,136,0.4); }

  .drawer-close {
    display: none;
    background: none; border: none; color: var(--text-dim);
    width: var(--tap); height: var(--tap); align-items: center; justify-content: center;
  }

  /* ---------- Main ---------- */
  .main {
    padding: clamp(0.9rem, 3vw, 1.6rem);
    display: flex; flex-direction: column; gap: 1rem; min-width: 0;
  }

  .banner {
    display: none; background: var(--danger-dim); border: 1px solid rgba(255,93,108,0.35);
    color: #ffb3ba; border-radius: var(--radius-sm); padding: 12px 14px; font-size: 0.85rem;
    align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .banner.show { display: flex; }
  .banner button { background: none; border: none; color: #ffb3ba; opacity: 0.7; padding: 2px; flex: none; }

  .main-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }

  .cards-grid {
    display: flex; flex-direction: column; gap: 12px;
  }

  .item-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    display: flex; flex-direction: column; gap: 10px;
    animation: cardIn 0.25s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .item-card.completed { border-color: rgba(53,212,136,0.4); box-shadow: 0 0 0 1px rgba(53,212,136,0.08); }

  .card-top {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    border-bottom: 1px solid var(--border-soft); padding-bottom: 10px;
  }
  .card-top-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .card-phone { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; color: var(--text-bright); letter-spacing: 0.01em; }
  .card-meta { display: flex; align-items: center; gap: 8px; }
  .card-tx { font-family: var(--mono); font-size: 0.68rem; color: var(--text-dim); }

  .badge {
    font-size: 0.62rem; padding: 3px 9px; border-radius: 20px; font-weight: 700;
    text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .badge-polling { background: var(--accent-dim); color: var(--accent); }
  .badge-ok { background: var(--ok-dim); color: var(--ok); }
  .badge-wait { background: var(--warn-dim); color: var(--warn); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-polling .badge-dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .card-body {
    display: grid; grid-template-columns: minmax(0,220px) 1fr; gap: 12px;
  }

  .card-otp-pane {
    background: #0a0f16; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 8px; text-align: center;
  }
  .card-otp-pane.success { border-color: rgba(53,212,136,0.4); background: linear-gradient(180deg, rgba(53,212,136,0.06), #0a0f16 60%); }
  .card-otp-title { font-size: 0.63rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
  .card-otp-val { font-family: var(--mono); font-size: 1.7rem; font-weight: 800; color: var(--text-bright); letter-spacing: 0.1em; }
  .card-otp-val.pending { color: var(--text-dim); font-size: 1.4rem; }
  .card-otp-val.reveal { animation: reveal 0.4s ease; }
  @keyframes reveal { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  .otp-copy-row { display: flex; gap: 6px; align-items: center; }

  .card-log-pane { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  details.log-details { border: none; }
  details.log-details summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
    font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700;
    letter-spacing: 0.04em; padding: 6px 0;
  }
  details.log-details summary::-webkit-details-marker { display: none; }
  details.log-details summary .chev { transition: transform 0.15s ease; width: 12px; height: 12px; stroke: var(--text-dim); }
  details.log-details[open] summary .chev { transform: rotate(90deg); }

  .raw-response {
    background: #0a0f16; border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 11px; font-family: var(--mono); font-size: 0.73rem;
    color: #9fe2bf; word-break: break-all; white-space: pre-wrap; max-height: 100px; overflow-y: auto;
  }

  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; align-items: center; }

  .empty-state {
    text-align: center; padding: 2.5rem 1.5rem; color: var(--text-dim); font-size: 0.85rem;
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty-state .emoji { font-size: 1.8rem; display: block; margin-bottom: 0.5rem; }
  .empty-state strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 0.9rem; }

  /* ---------- Toasts ---------- */
  .toast-stack {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 100; align-items: center;
    width: min(92vw, 360px);
  }
  .toast {
    background: var(--card-bg-raised); border: 1px solid var(--border); color: var(--text-bright);
    padding: 10px 16px; border-radius: 20px; font-size: 0.8rem; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 8px; animation: toastIn 0.2s ease;
  }
  .toast.ok { border-color: rgba(53,212,136,0.4); }
  .toast svg { width: 14px; height: 14px; stroke: var(--ok); flex: none; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }

  /* ---------- Mobile ---------- */
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .hamburger { display: flex; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(85vw, 340px);
      z-index: 40; overflow-y: auto; transform: translateX(-100%);
      transition: transform 0.22s ease; box-shadow: 2px 0 24px rgba(0,0,0,0.5);
      padding-top: calc(1.1rem + env(safe-area-inset-top));
    }
    .sidebar.open { transform: translateX(0); }
    .drawer-close { display: flex; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.3rem; }
    .drawer-head-title { font-size: 0.85rem; font-weight: 700; color: var(--text-bright); }
  }

  @media (max-width: 640px) {
    .card-body { grid-template-columns: 1fr; }
    .card-otp-pane { flex-direction: row; justify-content: space-between; text-align: left; padding: 12px 14px; }
    .card-otp-title { writing-mode: horizontal-tb; }
    .topbar .sub { display: none; }
    .card-actions { flex-wrap: nowrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <button type="button" class="hamburger" onclick="openDrawer()" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="mark">OTP</div>
      <div class="topbar-titles">
        <h1>OTP Dashboard</h1>
        <div class="sub">Dynamic Sessions &amp; History Persistence</div>
      </div>
    </div>
    <div class="balance-tag">
      <span>Balance:</span>
      <span class="val" id="balanceText">—</span>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

  <!-- Sidebar / Drawer -->
  <div class="sidebar" id="sidebar">
    <div class="drawer-head">
      <span class="drawer-head-title">Menu</span>
      <button type="button" class="drawer-close" onclick="closeDrawer()" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="side-block">
      <div class="side-block-title">Credentials</div>
      <div class="input-group">
        <label for="apiKey">API Key</label>
        <div class="key-field">
          <input type="password" id="apiKey" placeholder="Enter API key" autocomplete="off" oninput="handleKeyChange()">
          <button type="button" class="toggle-visibility" id="visToggle" onclick="toggleKeyVisibility()">SHOW</button>
        </div>
        <button type="button" class="btn-balance" onclick="checkBalance()">Check Balance</button>
      </div>
    </div>

    <div class="side-block">
      <div class="side-block-title">New Request Parameters</div>
      <div class="grid-3">
        <div class="input-group">
          <label for="serviceInput">Service</label>
          <input type="text" id="serviceInput" value="qfp">
        </div>
        <div class="input-group">
          <label for="countryInput">Country</label>
          <input type="text" id="countryInput" value="22">
        </div>
        <div class="input-group">
          <label for="operatorInput">Operator</label>
          <input type="text" id="operatorInput" value="16">
        </div>
      </div>
      <button id="startBtn" class="btn-primary" onclick="startFlow()">
        <span id="startBtnLabel">+ Get New Number</span>
      </button>
    </div>

    <div class="side-block">
      <div class="side-block-title">
        <span>History &amp; Storage</span>
      </div>
      <button class="btn-secondary" onclick="exportHistoryJson()">📥 Export history as JSON</button>
      <button class="btn-secondary" style="color:var(--danger);" onclick="clearCurrentHistory()">Clear key history</button>
    </div>

  </div>

  <!-- Main Content -->
  <div class="main">
    <div id="banner" class="banner"></div>

    <div class="main-header">
      <div class="side-block-title" style="margin-bottom:0;">
        <span>Active &amp; historic numbers (<span id="sessionCount">0</span>)</span>
      </div>
    </div>

    <div id="cardsContainer" class="cards-grid">
      <div class="empty-state">
        <span class="emoji">🔑</span>
        <strong>No numbers yet</strong>
        Enter an API key in the menu, then request a new number to get started.
      </div>
    </div>
  </div>

</div>

<div class="toast-stack" id="toastStack"></div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzv4VJHauSrQ5tjdjrU4tZ_sfpx7-cvlOWSdpR5Jk-I7EpKk5HLQUVxboVTyMcnqeeR/exec";
  const CANCEL_LOCKOUT_SECONDS = 120;

  let keyDebounceTimer = null;
  let activePollers = {};
  let currentKeyHistory = [];
  let countdownTickerId = null;
  let justArrivedIds = new Set();

  /* ---------- Small utilities ---------- */
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function showToast(message, isOk) {
    const stack = document.getElementById("toastStack");
    const el = document.createElement("div");
    el.className = "toast" + (isOk ? " ok" : "");
    el.innerHTML = (isOk
      ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
      : "") + `<span>${escapeHtml(message)}</span>`;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.animation = "toastOut 0.2s ease forwards";
      setTimeout(() => el.remove(), 200);
    }, 2200);
  }

  async function copyToClipboard(text, label) {
    try {
      await navigator.clipboard.writeText(text);
      showToast(`${label} copied`, true);
    } catch (err) {
      showToast(`Couldn't copy ${label.toLowerCase()}`, false);
    }
  }

  function showBanner(msg) {
    const b = document.getElementById("banner");
    b.innerHTML = `<span>${msg}</span><button type="button" onclick="hideBanner()" aria-label="Dismiss">✕</button>`;
    b.classList.add("show");
  }
  function hideBanner() {
    document.getElementById("banner").classList.remove("show");
  }

  /* ---------- Drawer (mobile sidebar) ---------- */
  function openDrawer() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("drawerBackdrop").classList.add("show");
    document.body.style.overflow = "hidden";
  }
  function closeDrawer() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("drawerBackdrop").classList.remove("show");
    document.body.style.overflow = "";
  }

  function toggleKeyVisibility() {
    const input = document.getElementById("apiKey");
    const btn = document.getElementById("visToggle");
    if (input.type === "password") {
      input.type = "text";
      btn.textContent = "HIDE";
    } else {
      input.type = "password";
      btn.textContent = "SHOW";
    }
  }

  function handleKeyChange() {
    clearTimeout(keyDebounceTimer);
    const key = document.getElementById("apiKey").value.trim();
    if (!key) {
      loadHistoryForKey("");
      document.getElementById("balanceText").textContent = "—";
      return;
    }
    loadHistoryForKey(key);
    keyDebounceTimer = setTimeout(() => {
      checkBalance();
    }, 600);
  }

  function getStorageKey(key) {
    return `otp_history_${encodeURIComponent(key)}`;
  }

  function loadHistoryForKey(key) {
    Object.values(activePollers).forEach(clearInterval);
    activePollers = {};

    if (!key) {
      currentKeyHistory = [];
      renderCards();
      return;
    }
    let data = null;
    try {
      data = localStorage.getItem(getStorageKey(key));
    } catch (e) { /* storage unavailable */ }
    currentKeyHistory = data ? JSON.parse(data) : [];
    renderCards();

    currentKeyHistory.forEach(item => {
      if (item.status === 'POLLING') {
        startCardPolling(item.id, key);
      }
    });

    startCountdownTicker();
  }

  function saveCurrentHistory() {
    const key = document.getElementById("apiKey").value.trim();
    if (!key) return;
    try {
      localStorage.setItem(getStorageKey(key), JSON.stringify(currentKeyHistory));
    } catch (e) { /* storage unavailable */ }
  }

  function exportHistoryJson() {
    const key = document.getElementById("apiKey").value.trim();
    if (!key) {
      showBanner("<strong>API key required.</strong> Enter your key first.");
      return;
    }
    const filename = `${key.slice(0, 12)}_history.json`;
    const blob = new Blob([JSON.stringify(currentKeyHistory, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    showToast("History exported", true);
  }

  function clearCurrentHistory() {
    const key = document.getElementById("apiKey").value.trim();
    if (!key) return;
    if (confirm("Clear local history for this API key? This can't be undone.")) {
      Object.values(activePollers).forEach(clearInterval);
      activePollers = {};
      currentKeyHistory = [];
      saveCurrentHistory();
      renderCards();
      showToast("History cleared", true);
    }
  }

  async function checkBalance() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const balanceText = document.getElementById("balanceText");
    hideBanner();

    if (!apiKey) return;
    balanceText.textContent = "…";

    try {
      const url = `${GOOGLE_SCRIPT_URL}?action=getBalance&api_key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url);
      const text = await res.text();
      if (text.includes("ACCESS_BALANCE")) {
        const val = text.split(":")[1]?.trim() || text;
        balanceText.textContent = val;
      } else {
        balanceText.textContent = "Error";
      }
    } catch (err) {
      balanceText.textContent = "Error";
    }
  }

  function extractOtpCode(rawText) {
    if (!rawText) return null;
    const clean = rawText.replace(/^STATUS_OK:?/, "").trim();
    if (/^\d+$/.test(clean)) return clean;

    const re = /(?<![A-Za-z0-9])(\d{4,8})(?![A-Za-z0-9])/g;
    let m = re.exec(rawText);
    return m ? m[1] : null;
  }

  function getRemainingCancelSeconds(createdAtStr) {
    if (!createdAtStr) return 0;
    const elapsed = Math.floor((Date.now() - new Date(createdAtStr).getTime()) / 1000);
    return Math.max(0, CANCEL_LOCKOUT_SECONDS - elapsed);
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function startCountdownTicker() {
    if (countdownTickerId) clearInterval(countdownTickerId);
    countdownTickerId = setInterval(() => {
      currentKeyHistory.forEach(item => {
        const remaining = getRemainingCancelSeconds(item.createdAt);
        const btn = document.getElementById(`cancel-btn-${item.id}`);
        if (btn) {
          if (remaining > 0) {
            btn.disabled = true;
            btn.textContent = `Cancel (${formatTime(remaining)})`;
          } else {
            if (btn.disabled) {
              btn.disabled = false;
              btn.textContent = "Cancel number";
            }
          }
        }
      });
    }, 1000);
  }

  async function startFlow() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const service = document.getElementById("serviceInput").value.trim() || 'qfp';
    const country = document.getElementById("countryInput").value.trim() || '22';
    const operator = document.getElementById("operatorInput").value.trim() || '16';
    const startBtn = document.getElementById("startBtn");
    const startBtnLabel = document.getElementById("startBtnLabel");

    hideBanner();
    if (!apiKey) {
      showBanner("<strong>API key required.</strong> Enter your key before proceeding.");
      openDrawer();
      return;
    }

    startBtn.disabled = true;
    startBtnLabel.textContent = "Requesting…";
    try {
      const url = `${GOOGLE_SCRIPT_URL}?action=getNumber&api_key=${encodeURIComponent(apiKey)}&service=${encodeURIComponent(service)}&country=${encodeURIComponent(country)}&operator=${encodeURIComponent(operator)}`;
      const res = await fetch(url);
      const text = await res.text();

      if (!text.includes("ACCESS_NUMBER")) {
        throw new Error(text || "Provider error on getNumber");
      }

      const parts = text.split(":");
      const txId = parts[1]?.trim();
      const phoneNum = parts[2]?.trim();

      const newItem = {
        id: txId,
        phone: phoneNum,
        service,
        country,
        status: "POLLING",
        otp: null,
        lastRawResponse: text,
        createdAt: new Date().toISOString()
      };

      currentKeyHistory.unshift(newItem);
      saveCurrentHistory();
      renderCards();
      startCountdownTicker();

      startCardPolling(txId, apiKey);
      checkBalance();
      showToast("New number requested", true);
      closeDrawer();
    } catch (err) {
      showBanner(`<strong>Failed to get number:</strong> ${escapeHtml(err.message)}`);
    } finally {
      startBtn.disabled = false;
      startBtnLabel.textContent = "+ Get New Number";
    }
  }

  function startCardPolling(id, apiKey) {
    if (activePollers[id]) clearInterval(activePollers[id]);

    const pollTask = async () => {
      try {
        const url = `${GOOGLE_SCRIPT_URL}?action=getStatus&api_key=${encodeURIComponent(apiKey)}&id=${encodeURIComponent(id)}`;
        const res = await fetch(url);
        const text = await res.text();

        // If cancelled on provider side: stop polling, purge history, and refresh balance
        if (text.includes("ACCESS_CANCEL")) {
          if (activePollers[id]) {
            clearInterval(activePollers[id]);
            delete activePollers[id];
          }
          currentKeyHistory = currentKeyHistory.filter(x => x.id !== id);
          saveCurrentHistory();
          renderCards();
          checkBalance();
          return;
        }

        const item = currentKeyHistory.find(x => x.id === id);
        if (!item) {
          clearInterval(activePollers[id]);
          return;
        }

        item.lastRawResponse = `[${new Date().toLocaleTimeString()}] ${text}`;

        if (text.startsWith("STATUS_OK")) {
          const wasSuccess = item.status === "SUCCESS";
          item.status = "SUCCESS";
          item.otp = extractOtpCode(text);
          if (!wasSuccess) {
            justArrivedIds.add(id);
            showToast(`Code received for ${item.phone}`, true);
            if (activePollers[id]) {
              clearInterval(activePollers[id]);
              delete activePollers[id];
            }
          }
        } else {
          item.status = "POLLING";
        }

        saveCurrentHistory();
        updateCardUI(item);
      } catch (err) {
        console.error(err);
      }
    };

    pollTask();
    activePollers[id] = setInterval(pollTask, 5000);
  }

  async function performAction(id, statusVal) {
    const apiKey = document.getElementById("apiKey").value.trim();
    if (!apiKey || !id) return;

    const item = currentKeyHistory.find(x => x.id === id);
    if (!item) return;

    if (statusVal === 8) {
      const rem = getRemainingCancelSeconds(item.createdAt);
      if (rem > 0) {
        showBanner(`Please wait ${formatTime(rem)} before cancelling this number.`);
        return;
      }
    }

    const actionText = statusVal === 8 ? "Cancelling..." : "Requesting code...";
    item.lastRawResponse = `[${new Date().toLocaleTimeString()}] ${actionText}`;
    updateCardUI(item);

    try {
      const url = `${GOOGLE_SCRIPT_URL}?action=setStatus&api_key=${encodeURIComponent(apiKey)}&id=${encodeURIComponent(id)}&status=${statusVal}`;
      const res = await fetch(url);
      const text = await res.text();

      // If ACCESS_CANCEL is confirmed: purge card from state, save, and hit checkBalance
      if (text.includes("ACCESS_CANCEL")) {
        if (activePollers[id]) {
          clearInterval(activePollers[id]);
          delete activePollers[id];
        }
        currentKeyHistory = currentKeyHistory.filter(x => x.id !== id);
        saveCurrentHistory();
        renderCards();
        checkBalance();
        showToast("Number cancelled", true);
        return;
      }

      const now = new Date().toLocaleTimeString();
      item.lastRawResponse = `[${now}] Action(${statusVal}): ${text}`;

      if (statusVal === 3) {
        item.otp = null;
        item.status = "POLLING";
        startCardPolling(id, apiKey);
        showToast("Requested a new code", true);
      }

      saveCurrentHistory();
      updateCardUI(item);
    } catch (err) {
      showBanner(`Action failed: ${escapeHtml(err.message)}`);
      item.lastRawResponse = `[${new Date().toLocaleTimeString()}] Error: ${err.message}`;
      updateCardUI(item);
    }
  }

  function renderCards() {
    const container = document.getElementById("cardsContainer");
    document.getElementById("sessionCount").textContent = currentKeyHistory.length;

    if (currentKeyHistory.length === 0) {
      const apiKey = document.getElementById("apiKey").value.trim();
      container.innerHTML = apiKey
        ? `<div class="empty-state"><span class="emoji">📭</span><strong>No numbers yet</strong>Request a new number from the menu to see it appear here.</div>`
        : `<div class="empty-state"><span class="emoji">🔑</span><strong>No numbers yet</strong>Enter an API key in the menu, then request a new number to get started.</div>`;
      return;
    }

    container.innerHTML = currentKeyHistory.map(item => generateCardHtml(item)).join("");
  }

  function updateCardUI(item) {
    const el = document.getElementById(`card-${item.id}`);
    if (el) {
      const wasOpen = el.querySelector("details.log-details")?.open;
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = generateCardHtml(item);
      const newEl = tempDiv.firstElementChild;
      if (wasOpen) {
        const d = newEl.querySelector("details.log-details");
        if (d) d.open = true;
      }
      el.replaceWith(newEl);
    } else {
      renderCards();
    }
  }

  function generateCardHtml(item) {
    let badgeClass = "badge-wait";
    let badgeText = item.status;

    if (item.status === "POLLING") {
      badgeClass = "badge-polling";
      badgeText = "Polling 5s";
    } else if (item.status === "SUCCESS") {
      badgeClass = "badge-ok";
      badgeText = "Received";
    }

    const remSeconds = getRemainingCancelSeconds(item.createdAt);
    const isCancelDisabled = remSeconds > 0;
    const cancelLabel = isCancelDisabled ? `Cancel (${formatTime(remSeconds)})` : 'Cancel number';

    const safePhone = escapeHtml(item.phone || "—");
    const safeId = escapeHtml(item.id || "");
    const safeOtp = item.otp ? escapeHtml(item.otp) : "";
    const safeLog = escapeHtml(item.lastRawResponse || "No response received yet.");

    const isNewArrival = item.otp && justArrivedIds.has(item.id);
    if (isNewArrival) justArrivedIds.delete(item.id);

    const otpDisplay = item.otp
      ? `<div class="card-otp-val${isNewArrival ? ' reveal' : ''}">${safeOtp}</div>
         <div class="otp-copy-row">
           <button type="button" class="icon-btn" title="Copy code" aria-label="Copy code" onclick="copyToClipboard('${safeOtp}', 'Code')">
             <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
           </button>
         </div>`
      : `<div class="card-otp-val pending">Waiting…</div>`;

    return `
      <div class="item-card ${item.status === 'SUCCESS' ? 'completed' : ''}" id="card-${item.id}">
        <div class="card-top">
          <div class="card-top-left">
            <span class="card-phone">${safePhone}</span>
            <button type="button" class="icon-btn" title="Copy number" aria-label="Copy number" onclick="copyToClipboard('${safePhone}', 'Number')">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <span class="badge ${badgeClass}"><span class="badge-dot"></span>${badgeText}</span>
          </div>
          <div class="card-tx">TX ${safeId}</div>
        </div>

        <div class="card-body">
          <div class="card-otp-pane${item.status === 'SUCCESS' ? ' success' : ''}">
            <div class="card-otp-title">OTP code</div>
            ${otpDisplay}
          </div>

          <div class="card-log-pane">
            <div class="card-actions">
              <button id="cancel-btn-${safeId}" class="btn-cancel" onclick="performAction('${safeId}', 8)" ${isCancelDisabled ? 'disabled' : ''}>${cancelLabel}</button>
              <button class="btn-new-code" onclick="performAction('${safeId}', 3)">Request new code</button>
            </div>
            <details class="log-details">
              <summary>
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                Live API response
              </summary>
              <div class="raw-response">${safeLog}</div>
            </details>
          </div>
        </div>
      </div>
    `;
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
  });

  startCountdownTicker();
</script>

</body>
</html>

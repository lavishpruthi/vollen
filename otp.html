<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OTP Service - Auto Poll Status</title>
  <style>
    body { font-family: monospace; background: #121212; color: #fff; padding: 2rem; }
    .card { max-width: 550px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    button.stop { background: #dc3545; margin-top: 10px; display: none; }
    button.copy { background: #17a2b8; margin-top: 5px; padding: 6px 12px; font-size: 12px; width: auto; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #555; cursor: not-allowed; }
    .box { background: #000; padding: 10px; margin-top: 8px; border-radius: 4px; word-break: break-all; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-polling { background: #28a745; color: #fff; }
    .badge-idle { background: #6c757d; color: #fff; }
    .flex-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>OTP Service (Google Proxy)</h2>
  
  <label>API Key:</label>
  <input type="text" id="apiKey" placeholder="Enter YOUR_API_KEY">
  
  <button id="startBtn" onclick="startFlow()">1. Get Number & Start Polling</button>
  <button id="stopBtn" class="stop" onclick="stopPolling()">Stop Polling API 2</button>

  <h3>API 1 Response:</h3>
  <div id="api1Box" class="box">Waiting...</div>

  <h3>Extracted ID:</h3>
  <div id="idBox" class="box">-</div>

  <div class="flex-row" style="margin-top: 1rem;">
    <h3 style="margin: 0;">Extracted Mobile Number:</h3>
    <button id="copyNumBtn" class="copy" onclick="copyNumber()" disabled>Copy Number</button>
  </div>
  <div id="numberBox" class="box">-</div>

  <h3>
    API 2 Response (Status): 
    <span id="pollStatus" class="badge badge-idle">IDLE</span>
  </h3>
  <div id="api2Box" class="box">Waiting for ID...</div>
</div>

<script>
  // Deployed Google Apps Script Web App URL:
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyasNj-iyD0Wa4GQ3l0DIA0IinW0V_Mv0UU4m6F0i6NTfZBpIavD_V2nHZORUyrGF52/exec";

  let pollIntervalId = null;
  let activeId = null;
  let activeNumber = null;

  async function startFlow() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const api1Box = document.getElementById("api1Box");
    const idBox = document.getElementById("idBox");
    const numberBox = document.getElementById("numberBox");
    const api2Box = document.getElementById("api2Box");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const copyBtn = document.getElementById("copyNumBtn");

    if (!apiKey) return alert("Enter API Key");

    // Clear previous state and activeId before starting new request
    stopPolling();

    api1Box.textContent = "Fetching API 1 via Google...";
    idBox.textContent = "-";
    numberBox.textContent = "-";
    api2Box.textContent = "Waiting...";
    copyBtn.disabled = true;
    copyBtn.textContent = "Copy Number";

    try {
      // 1. Fetch API 1 to get ACCESS_NUMBER and ID
      const res1 = await fetch(`${GOOGLE_SCRIPT_URL}?action=getNumber&api_key=${apiKey}&service=qfp&country=22&operator=16`);
      const text1 = await res1.text();
      api1Box.textContent = text1;

      if (!text1.includes("ACCESS_NUMBER")) {
        throw new Error("API 1 failed or returned an error.");
      }

      // 2. Extract ID & Number (Format: ACCESS_NUMBER:12345:919876543210)
      const parts = text1.split(":");
      const extractedId = parts[1] ? parts[1].trim() : null;
      const extractedNumber = parts[2] ? parts[2].trim() : null;

      // Check if valid activeId was found
      if (extractedId) {
        activeId = extractedId;
        idBox.textContent = activeId;
      } else {
        throw new Error("Invalid or missing ID in API 1 response.");
      }

      // Display and store phone number
      if (extractedNumber) {
        activeNumber = extractedNumber;
        numberBox.textContent = activeNumber;
        copyBtn.disabled = false;
      }

      // 3. UI Update for active polling state
      startBtn.disabled = true;
      stopBtn.style.display = "block";
      updatePollStatusBadge(true);

      // 4. Hit API 2 immediately, then schedule retry every 5 seconds IF activeId exists
      if (activeId) {
        fetchStatus(apiKey);

        pollIntervalId = setInterval(() => {
          // Strictly verify activeId exists before hitting API 2
          if (activeId) {
            fetchStatus(apiKey);
          } else {
            console.warn("activeId no longer present. Stopping loop.");
            stopPolling();
          }
        }, 5000);
      }

    } catch (err) {
      api2Box.textContent = `Error: ${err.message}`;
      stopPolling();
    }
  }

  // Helper function to hit API 2
  async function fetchStatus(apiKey) {
    if (!activeId) return; // Guard clause

    const api2Box = document.getElementById("api2Box");
    const now = new Date().toLocaleTimeString();

    try {
      const res2 = await fetch(`${GOOGLE_SCRIPT_URL}?action=getStatus&api_key=${apiKey}&id=${activeId}`);
      const text2 = await res2.text();
      
      api2Box.textContent = `[${now}] ${text2}`;

      // Optional: Auto-stop polling if SMS/OTP arrives (e.g. status starts with STATUS_OK)
      if (text2.startsWith("STATUS_OK")) {
        console.log("OTP Received! Auto-stopping polling.");
        stopPolling();
      }

    } catch (err) {
      api2Box.textContent = `[${now}] Error: ${err.message}`;
    }
  }

  // Helper function to copy the extracted number to clipboard
  async function copyNumber() {
    if (!activeNumber) return;
    try {
      await navigator.clipboard.writeText(activeNumber);
      const copyBtn = document.getElementById("copyNumBtn");
      copyBtn.textContent = "Copied!";
      setTimeout(() => {
        copyBtn.textContent = "Copy Number";
      }, 2000);
    } catch (err) {
      alert("Failed to copy number.");
    }
  }

  // Function to stop polling and reset activeId state
  function stopPolling() {
    if (pollIntervalId) {
      clearInterval(pollIntervalId);
      pollIntervalId = null;
    }
    
    activeId = null; // Reset active ID
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").style.display = "none";
    updatePollStatusBadge(false);
  }

  function updatePollStatusBadge(isPolling) {
    const badge = document.getElementById("pollStatus");
    if (isPolling) {
      badge.textContent = "POLLING EVERY 5s";
      badge.className = "badge badge-polling";
    } else {
      badge.textContent = "IDLE";
      badge.className = "badge badge-idle";
    }
  }
</script>

</body>
</html>

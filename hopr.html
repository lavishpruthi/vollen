<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver & Customer Ledger</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --primary: #2563eb; --success: #16a34a;
      --warn-bg: #fefce8; --warn-border: #fef08a; --warn-text: #854d0e;
      --danger: #ef4444; --chip: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --card: #131b2c; --text: #e6ebf5; --muted: #93a1b7;
        --border: #253248; --primary: #5b8def; --success: #34d399;
        --warn-bg: #2a230c; --warn-border: #4d3d10; --warn-text: #fbd975;
        --danger: #f87171; --chip: #1a2438;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); margin: 0; padding: 16px;
      max-width: 640px; margin-inline: auto;
    }

    #progress-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 4px;
      background: transparent; z-index: 9999; display: none;
    }
    #progress-bar {
      height: 100%; width: 100%; background: var(--primary);
      animation: indeterminate 1.2s infinite linear;
      transform-origin: 0% 50%;
    }
    @keyframes indeterminate {
      0% { transform: translateX(0) scaleX(0.05); }
      40% { transform: translateX(30%) scaleX(0.4); }
      100% { transform: translateX(100%) scaleX(0.1); }
    }

    header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
    #status {
      font-size: 13px; color: var(--muted); background: var(--chip);
      padding: 6px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    #status.ok .dot { background: var(--success); }
    #status.err .dot { background: var(--danger); }
    #status.busy .dot { background: var(--primary); }

    .driver-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; margin-bottom: 20px;
    }
    .driver-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
    .driver-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .driver-btn {
      border: 1px solid var(--border); background: var(--chip); padding: 8px 14px;
      border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted);
      cursor: pointer; white-space: nowrap; display: flex; flex-direction: column; align-items: center;
    }
    .driver-btn small { font-size: 10px; opacity: 0.8; }
    .driver-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .add-driver-form {
      display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
    }
    .add-driver-form input {
      padding: 8px 10px; font-size: 13px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg); color: var(--text); outline: none;
    }
    .btn-secondary {
      background: var(--chip); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0 12px; font-weight: 600; font-size: 13px; cursor: pointer;
    }

    .add-cust-box { display: flex; gap: 8px; margin-bottom: 20px; }
    .add-cust-box input {
      flex: 1; padding: 12px 14px; font-size: 15px; border: 1px solid var(--border);
      border-radius: 10px; outline: none; background: var(--card); color: var(--text);
    }
    .btn-primary {
      background: var(--primary); color: #fff; border: none; border-radius: 10px;
      padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    .section-head { font-size: 15px; font-weight: 700; margin: 20px 0 10px; display: flex; justify-content: space-between; }
    .badge { font-size: 12px; background: var(--chip); color: var(--muted); padding: 2px 8px; border-radius: 12px; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .empty { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; border: 1px dashed var(--border); border-radius: 10px; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; }
    .cust-title { font-weight: 600; font-size: 15px; }
    .cust-id { font-size: 12px; color: var(--muted); font-family: monospace; }

    .pills { display: flex; gap: 6px; height: 8px; }
    .pill { flex: 1; background: var(--chip); border-radius: 4px; }
    .pill.filled { background: var(--primary); }

    .meta-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .fee-tag { font-weight: 600; }
    .fee-tag.ready { color: var(--success); }

    .btn-step {
      width: 100%; padding: 10px; border: none; background: var(--chip);
      color: var(--primary); border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .incentive-box {
      background: var(--warn-bg); border: 1px solid var(--warn-border); padding: 10px;
      border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .incentive-box span { font-size: 13px; font-weight: 700; color: var(--warn-text); }
    .amt-input { width: 70px; padding: 6px; font-size: 14px; border: 1px solid var(--border); border-radius: 4px; text-align: right; }
    .btn-pay { background: #ca8a04; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<header>
  <div>
    <h1>Rider Ledger</h1>
    <div id="activeDriverLabel" style="font-size:13px; color:var(--muted);">Select a driver</div>
  </div>
  <div id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
</header>

<div class="driver-box">
  <div class="driver-title">Drivers</div>
  <div class="driver-tabs" id="driverTabs"></div>
  
  <div class="add-driver-form">
    <input type="text" id="newDriverId" placeholder="ID (e.g. D1)" style="width: 100px;">
    <input type="text" id="newDriverName" placeholder="Driver Name" style="flex: 1;">
    <button class="btn-secondary" onclick="handleAddDriver()">+ Add Driver</button>
  </div>
</div>

<div class="add-cust-box">
  <input type="text" id="custNameInput" placeholder="Add customer for current driver..." autocomplete="off">
  <button class="btn-primary" onclick="handleAddCustomer()">Add</button>
</div>

<div class="section-head">
  <span>In Progress</span><span class="badge" id="activeBadge">0</span>
</div>
<div class="list" id="activeList"></div>

<div class="section-head">
  <span>History (Incentive Paid)</span><span class="badge" id="historyBadge">0</span>
</div>
<div class="list" id="historyList"></div>

<script>
  // VERIFY YOUR DEPLOYMENT URL HERE
  const API_URL = "https://script.google.com/macros/s/AKfycbwLeBz8ElKd90cjSTiwTEjDJsKIAeT5JPut-fOLWaoo7lx0UIIwL75HewYWmwbs6mbbDQ/exec";
  const TARGET_RIDES = 3;
  const DEFAULT_INCENTIVE = 300;

  let drivers = [];
  let currentDriverId = null;
  let customers = [];

  function showBar(msg) {
    document.getElementById('progress-container').style.display = 'block';
    setStatus(msg, 'busy');
  }

  function hideBar(msg, statusClass) {
    document.getElementById('progress-container').style.display = 'none';
    setStatus(msg, statusClass);
  }

  function setStatus(msg, state) {
    document.getElementById('statusText').innerText = msg;
    document.getElementById('status').className = state || '';
  }

  async function request(params) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);
    try {
      const query = new URLSearchParams(params).toString();
      const res = await fetch(`${API_URL}?${query}`, { method: 'GET', signal: controller.signal });
      clearTimeout(timer);
      const json = await res.json();
      if (json && json.error) throw new Error(json.error);
      return json;
    } catch (err) {
      clearTimeout(timer);
      throw (err.name === 'AbortError') ? new Error('Request timed out') : err;
    }
  }

  async function init() {
    showBar('Loading drivers…');
    try {
      drivers = await request({ action: 'get_drivers' });
      if (!drivers || drivers.length === 0) {
        const defaults = [
          { driverId: 'D1', name: 'Tanmay' },
          { driverId: 'D2', name: 'Jashan' },
          { driverId: 'D3', name: 'Prince' },
          { driverId: 'D4', name: 'Lavish' }
        ];
        for (const s of defaults) {
          await request({ action: 'add_driver', driverId: s.driverId, name: s.name });
        }
        drivers = await request({ action: 'get_drivers' });
      }
      renderDriverTabs();
      if (drivers.length > 0) {
        selectDriver(drivers[0].driverId);
      }
    } catch (e) {
      hideBar('Failed: ' + e.message, 'err');
    }
  }

  function renderDriverTabs() {
    const wrap = document.getElementById('driverTabs');
    wrap.innerHTML = drivers.map(d => `
      <button class="driver-btn ${d.driverId === currentDriverId ? 'active' : ''}" onclick="selectDriver('${d.driverId}')">
        <span>${d.name}</span>
        <small>${d.driverId}</small>
      </button>
    `).join('');
  }

  async function selectDriver(dId) {
    currentDriverId = dId;
    renderDriverTabs();

    const dObj = drivers.find(d => String(d.driverId) === String(dId));
    document.getElementById('activeDriverLabel').innerText = dObj ? `${dObj.name} (${dObj.driverId})` : dId;

    showBar(`Loading customers for ${dObj ? dObj.name : dId}…`);
    try {
      customers = await request({ action: 'get_customers', driverId: dId });
      renderCustomers();
      hideBar(`Loaded ${customers.length} customer(s)`, 'ok');
    } catch (e) {
      hideBar('Load error: ' + e.message, 'err');
    }
  }

  async function handleAddDriver() {
    const idInput = document.getElementById('newDriverId');
    const nameInput = document.getElementById('newDriverName');
    const driverId = idInput.value.trim();
    const name = nameInput.value.trim();

    if (!driverId || !name) return alert('Provide both Driver ID and Name');

    showBar('Adding driver…');
    try {
      await request({ action: 'add_driver', driverId, name });
      idInput.value = '';
      nameInput.value = '';
      drivers = await request({ action: 'get_drivers' });
      renderDriverTabs();
      selectDriver(driverId);
    } catch (e) {
      hideBar(e.message, 'err');
    }
  }

  async function handleAddCustomer() {
    if (!currentDriverId) return alert('Select a driver first');
    const input = document.getElementById('custNameInput');
    const name = input.value.trim();
    if (!name) return;

    showBar(`Saving ${name}…`);
    try {
      await request({ action: 'add_customer', driverId: currentDriverId, customerName: name });
      input.value = '';
      // Refetch the full list directly from the sheet
      customers = await request({ action: 'get_customers', driverId: currentDriverId });
      renderCustomers();
      hideBar(`Added ${name}`, 'ok');
    } catch (e) {
      hideBar('Add failed: ' + e.message, 'err');
    }
  }

  async function bumpRide(customerId) {
    const c = customers.find(x => String(x.customerId) === String(customerId));
    if (!c) return;

    const nextRides = Math.min(c.rides + 1, TARGET_RIDES);
    c.rides = nextRides;
    renderCustomers();

    showBar('Recording ride…');
    try {
      await request({ action: 'update_customer', customerId, rides: nextRides });
      hideBar('Ride updated', 'ok');
    } catch (e) {
      hideBar('Update failed: ' + e.message, 'err');
    }
  }

  async function markIncentivePaid(customerId) {
    const c = customers.find(x => String(x.customerId) === String(customerId));
    if (!c) return;

    const amtBox = document.getElementById(`amt_${customerId}`);
    const amount = amtBox ? (Number(amtBox.value) || DEFAULT_INCENTIVE) : DEFAULT_INCENTIVE;

    c.incentiveGiven = true;
    c.incentiveAmount = amount;
    renderCustomers();

    showBar('Updating incentive status…');
    try {
      await request({
        action: 'update_customer',
        customerId,
        incentiveGiven: true,
        incentiveAmount: amount
      });
      hideBar('Incentive marked paid', 'ok');
    } catch (e) {
      hideBar('Update failed: ' + e.message, 'err');
    }
  }

  function renderCustomers() {
    const active = customers.filter(c => !c.incentiveGiven);
    const history = customers.filter(c => c.incentiveGiven);

    document.getElementById('activeBadge').innerText = active.length;
    document.getElementById('historyBadge').innerText = history.length;

    const activeWrap = document.getElementById('activeList');
    if (active.length === 0) {
      activeWrap.innerHTML = `<div class="empty">No active customers for this driver.</div>`;
    } else {
      activeWrap.innerHTML = active.map(c => {
        let pills = '';
        for (let i = 1; i <= TARGET_RIDES; i++) {
          pills += `<div class="pill ${i <= c.rides ? 'filled' : ''}"></div>`;
        }
        const isEligible = c.rides >= TARGET_RIDES;

        return `
          <div class="card">
            <div class="card-top">
              <span class="cust-title">${c.customerName}</span>
              <span class="cust-id">#${c.customerId}</span>
            </div>
            <div class="pills">${pills}</div>
            <div class="meta-row">
              <span>${c.rides}/${TARGET_RIDES} rides completed</span>
              <span class="fee-tag ${isEligible ? 'ready' : ''}">
                ${isEligible ? '✓ Target Achieved' : 'In Progress'}
              </span>
            </div>
            ${isEligible ? `
              <div class="incentive-box">
                <span>Incentive Due</span>
                <div>
                  ₹<input type="number" id="amt_${c.customerId}" class="amt-input" value="${c.incentiveAmount}">
                  <button class="btn-pay" onclick="markIncentivePaid('${c.customerId}')">Mark Paid</button>
                </div>
              </div>
            ` : `
              <button class="btn-step" onclick="bumpRide('${c.customerId}')">+1 Ride Completed</button>
            `}
          </div>
        `;
      }).join('');
    }

    const historyWrap = document.getElementById('historyList');
    if (history.length === 0) {
      historyWrap.innerHTML = `<div class="empty">No paid records for this driver.</div>`;
    } else {
      historyWrap.innerHTML = history.map(c => `
        <div class="card" style="opacity: 0.85;">
          <div class="card-top">
            <span class="cust-title">${c.customerName}</span>
            <span class="cust-id">#${c.customerId}</span>
          </div>
          <div class="meta-row">
            <span>Completed ${c.rides}/${TARGET_RIDES} rides</span>
            <span style="font-weight: 600; color: var(--success)">Paid: ₹${c.incentiveAmount}</span>
          </div>
        </div>
      `).join('');
    }
  }

  document.getElementById('custNameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAddCustomer();
  });

  init();
</script>

</body>
</html>

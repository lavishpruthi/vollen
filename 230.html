<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendant e-Pass — Medanta Demo</title>
<style>
  :root{
    --coral1:#e9967f; --coral2:#d9735c; --teal:#5f9ea0; --red:#d9534f;
    --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --radius:22px; --shadow:0 10px 30px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f1f1f1; color:var(--ink);
    display:flex; justify-content:center;
  }
  .phone{
    width:100%; max-width:430px; min-height:100vh;
    background:linear-gradient(180deg,#e07a68 0%,#e9a193 40%,#f6d3cc 70%,#fdf3f1 100%);
    border-radius:0 0 34px 34px;
    padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 28px);
    position:relative;
  }
  .topbar{display:flex; align-items:center; justify-content:space-between; margin:28px 2px 18px; gap:10px}
  .topbar h1{color:#fff; font-size:21px; font-weight:700}
  .logo{
    background:#fff; border-radius:10px; padding:5px 9px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); width:155px; height:65px; flex:0 0 auto;
  }
  .logo img{width:100%; height:100%; object-fit:contain; display:block}

  .avatar{
    width:230px; height:230px; border-radius:50%; margin:6px auto 22px;
    border:7px solid rgba(255,255,255,.55); background:#eceff1; overflow:hidden;
    display:flex; align-items:center; justify-content:center; position:relative; box-shadow:var(--shadow);
  }
  .avatar video,.avatar img{width:100%; height:100%; object-fit:cover; display:block}
  .avatar .hint{position:absolute; color:var(--muted); font-size:13px; text-align:center; padding:0 20px}
  .avatar video{transform:scaleX(-1)}
  .avatar.captured video{display:none}

  .field{
    width:100%; background:#fff; border:none; border-radius:18px;
    padding:18px 20px; font-size:17px; color:var(--ink); margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.08); outline:none;
  }
  .field::placeholder{color:#9aa1ab}
  .field:focus{box-shadow:0 0 0 3px rgba(255,255,255,.5)}

  .consent{display:flex; gap:12px; align-items:flex-start; margin:6px 2px 20px}
  .consent input{
    appearance:none; -webkit-appearance:none; min-width:26px; height:26px; margin-top:2px;
    border:2px solid #fff; border-radius:7px; background:rgba(255,255,255,.18); cursor:pointer; position:relative;
  }
  .consent input:checked{background:#1a73e8; border-color:#1a73e8}
  .consent input:checked::after{
    content:""; position:absolute; left:8px; top:3px; width:7px; height:13px;
    border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg);
  }
  .consent label{color:rgba(255,255,255,.85); font-size:18px; line-height:1.45; font-weight:300}

  .btn{
    width:100%; border:none; border-radius:18px; padding:18px; font-size:19px; font-weight:700;
    color:#fff; background:var(--teal); cursor:pointer; box-shadow:var(--shadow); transition:transform .06s,opacity .2s;
  }
  .btn:active{transform:scale(.99)}
  .btn[disabled]{opacity:.55; cursor:not-allowed}
  .btn-row{display:flex; gap:16px}
  .btn-row .btn{flex:1; width:auto; background:#0f5aa8; border-radius:999px; padding:20px 10px; font-size:21px; font-weight:500; box-shadow:none}
  .btn-remove{margin-left:0}
  .reg .rm{display:flex; justify-content:center; padding-left:36%}

  .card{
    background:#fff; border-radius:var(--radius); padding:26px 24px; margin-top:22px;
    box-shadow:var(--shadow); line-height:1.75;
  }
  .card .row{font-size:20px; color:#111; font-family:Roboto,Arial,sans-serif}
  .card .row b{color:#111; font-weight:600}
  .card .row span{color:#333}
  .card .two{display:flex; justify-content:space-between; gap:12px}

  .reg{
    background:#fff; border-radius:var(--radius); margin-top:18px; padding:22px 24px 26px;
    box-shadow:var(--shadow); text-align:center;
  }
  .reg h2{color:#0f5aa8; font-size:24px; font-weight:500; margin-bottom:14px}
  .reg hr{border:none; border-top:1px solid var(--line); margin:14px 0}
  .btn-remove{
    border:none; background:#dc3545; color:#fff; font-size:23px; padding:12px 20px;
    border-radius:6px; cursor:pointer; box-shadow:0 4px 12px rgba(217,83,79,.35);
  }
  .btn-remove:active{transform:scale(.98)}

  .footer{
    margin:26px auto 0; background:#fff; border-radius:999px; width:max-content;
    padding:12px 26px; font-size:15px; color:#374151; box-shadow:var(--shadow);
  }
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#1f2937; color:#fff; padding:12px 20px; border-radius:12px; font-size:14px;
    opacity:0; transition:all .3s; z-index:20; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>

  <div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const video = $('#video'), photo = $('#photo'), avatar = $('#avatar'),
        hint = $('#avatarHint'), retakeBtn = $('#retakeBtn'), saveBtn = $('#saveBtn'),
        consent = $('#consent'), fileCam = $('#fileCam');
  let stream = null, captured = false;

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  async function startCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ return false; }
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
      video.srcObject = stream; video.style.display = 'block'; hint.style.display = 'none';
      return true;
    }catch(e){ return false; }
  }

  startCamera().then(ok=>{
    if(!ok){ hint.innerHTML = 'Tap “Capture” to<br>take a photo'; }
  });

  function doCaptureFromVideo(){
    const c = document.createElement('canvas');
    const w = video.videoWidth || 480, h = video.videoHeight || 480;
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.translate(w,0); ctx.scale(-1,1);
    ctx.drawImage(video,0,0,w,h);
    photo.src = c.toDataURL('image/jpeg',0.9);
    showCaptured();
  }

  function showCaptured(){
    photo.style.display = 'block'; video.style.display = 'none'; hint.style.display = 'none';
    avatar.classList.add('captured');
    captured = true;
    toast('Photo captured');
  }

  fileCam.addEventListener('change', e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => { photo.src = ev.target.result; showCaptured(); };
    r.readAsDataURL(f);
  });

  function resetPhoto(){
    photo.style.display = 'none'; avatar.classList.remove('captured'); captured = false;
    if(stream && video.videoWidth){ video.style.display = 'block'; hint.style.display = 'none'; }
    else { hint.style.display = 'block'; }
  }
  retakeBtn.addEventListener('click', ()=>{
    if(captured){ resetPhoto(); return; }
    if(stream && video.videoWidth){ doCaptureFromVideo(); } else { fileCam.click(); }
  });
  saveBtn.addEventListener('click', ()=>{
    if(!consent.checked){ toast('Please accept the consent first'); return; }
    if(!captured){ toast('Please capture a photo first'); return; }
    if($('#mobile').value.length !== 10){ toast('Enter a valid 10-digit mobile number'); return; }
    if(!$('#vname').value.trim()){ toast('Enter visitor name'); return; }
    toast('Saved');
  });

  $('#removeBtn').addEventListener('click', ()=>{
    $('#mobile').value=''; $('#vname').value=''; consent.checked=false;
    resetPhoto();
    toast('Registration cleared');
  });

  $('#mobile').addEventListener('input', e=>{ e.target.value = e.target.value.replace(/\D/g,''); });
})();
</script>
